name: Build Fresh Aero
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read

jobs:
  windows-vst3:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: lukka/get-cmake@latest
      - run: cmake -S . -B build -A x64 -DG3X_BUILD_PLUGIN=ON
      - run: cmake --build build --config Release --target FreshAero_VST3 FreshAero_Standalone
      - name: Package Windows VST3
        shell: pwsh
        run: ./scripts/package-vst3.ps1 -BundlePath "build/FreshAero_artefacts/Release/VST3/Fresh Aero.vst3" -Destination dist
      - name: Upload Windows VST3
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fresh-Aero-Windows-x64-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Download instructions
        shell: pwsh
        env:
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        run: |
          "[Download Windows x64 VST3]($env:ARTIFACT_URL) — available for 30 days." >> $env:GITHUB_STEP_SUMMARY
          "Extract the ZIP, verify SHA256SUMS.txt, then copy the entire Fresh Aero.vst3 folder to your VST3 directory." >> $env:GITHUB_STEP_SUMMARY
